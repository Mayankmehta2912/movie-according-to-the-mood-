<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoodMatch — Movies & Books for how you feel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><div class="brand">🎭 MoodMatch</div><div class="grow"></div>
<button class="ghost" id="key" title="Poster settings">🖼 Posters</button>
</header>

<div id="find">
 <div class="card">
  <h2>How are you feeling right now?</h2>
  <div class="sub">choose ur mood below — pick as many as you like.</div>
  <div class="moods" id="moods"></div>
  <div class="ctl">
   <div><label>What do you want?</label><div class="seg" id="goal"></div></div>
      <div><label>Cinema</label><div class="seg" id="cin"></div></div>
   <div><label>Energy level: <b id="ev">3</b>/5</label><input type="range" id="energy" min="1" max="5" value="3"></div>
  </div>
  <button class="btn" id="go">🎬📚 Find my mood match</button>
 </div>
 <div id="res"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="script.js" defer></script>
</body>
</html>
